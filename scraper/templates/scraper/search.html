{% extends 'scraper/base.html' %}

{% block content %}
<div class="glass-card search-container">
    <h1 class="search-title">Subitissimo</h1>
    <p class="search-subtitle">Advanced scraping & analysis for Subito.it</p>
    
    <form method="post" action="" class="search-form">
        {% csrf_token %}
        <p id="searchError" style="color: #f87171; margin: 0;{% if not error %} display: none;{% endif %}">Scrivi cosa cerchi oppure scegli una categoria.</p>
        <div class="form-group">
            <input type="text" name="query" class="form-input" placeholder="Cosa cerchi? Vuoto = tutti gli annunci della categoria" autofocus>
        </div>
        <div class="form-group">
            <select name="category" class="form-input">
                <option value="">Tutte le categorie</option>
                {% for macro_key, macro_name, cats in macrocategories %}
                <option value="{{ macro_key }}" class="macro-option">{{ macro_name }}</option>
                {% for key, name in cats %}
                <option value="{{ key }}">&nbsp;&nbsp;&nbsp;&nbsp;{{ name }}</option>
                {% endfor %}
                {% endfor %}
            </select>
        </div>
        <div class="form-group" style="display: flex; gap: 20px; align-items: center; margin-bottom: 15px;">
             <label style="display: flex; align-items: center; gap: 8px; color: var(--text-muted); cursor: pointer;">
                <input type="checkbox" name="title_only" style="width: auto; margin: 0;">
                <span>Title Only</span>
            </label>
            <label style="display: flex; align-items: center; gap: 8px; color: var(--text-muted); cursor: pointer;">
                <input type="checkbox" name="shippable_only" style="width: auto; margin: 0;">
                <span>Spedizione Disponibile</span>
            </label>
        </div>
        
        <div class="form-group" style="display: flex; gap: 10px;">
            <input type="number" name="limit" class="form-input" value="35" min="10" max="100" title="Results per page" style="flex: 1;">
            <button type="submit" class="btn-primary" style="flex: 2;">
                <span>Start Scraping</span>
                <div class="spinner"></div>
            </button>
        </div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <p id="loadingText" style="display:none; color: var(--text-muted); margin-top: 10px; font-size: 0.9rem;">Scraping in progress... please wait.</p>
    </form>
</div>

<script>
document.querySelector('.search-form').addEventListener('submit', function(e) {
    const query = this.querySelector('[name="query"]').value.trim();
    const category = this.querySelector('[name="category"]').value;
    if (!query && !category) {
        e.preventDefault();
        document.getElementById('searchError').style.display = 'block';
        return;
    }
    document.body.classList.add('loading');
    document.getElementById('loadingText').style.display = 'block';
    
    const bar = document.getElementById('progressBar');
    let width = 0;
    // Simulate progress - fast at first, then slows down
    const interval = setInterval(() => {
        if (width >= 90) {
            clearInterval(interval);
        } else {
            // Logarithmic-ish increment
            const increment = Math.max(0.5, (95 - width) / 20);
            width += increment;
            bar.style.width = width + '%';
        }
    }, 100);
});
</script>
{% endblock %}
